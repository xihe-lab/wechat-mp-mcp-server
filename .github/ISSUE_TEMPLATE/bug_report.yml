name: 缺陷报告
description: 报告 MCP Server 或其工具的行为问题
labels: ["type/bug", "flow/needs-triage"]
body:
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 一句话概括错误行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在 MCP 客户端（Claude Code、Cursor…）调用 wechat_xxx
        2. 传参 ...
        3. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 vs 实际行为
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响层面
      options:
        - 官方 API 层（素材 / 草稿 / 发布 / 凭据）
        - Web 会话层（登录 / 长文直写 / 传图 / 数据统计）
        - HTML 检查（lint 规则误报/漏报）
        - 仓库级（构建 / 发布 / 安装 / 文档）
        - 不确定
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 相关工具名（如适用）
      placeholder: 如 wechat_web_write_draft、wechat_draft_add
  - type: dropdown
    id: version
    attributes:
      label: 版本
      options:
        - 0.2.0 及以上
        - 0.1.x
        - 未发布（main / 分支自建）
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: 涉及通道
      options:
        - 官方 API 层（AppID/AppSecret + access_token）
        - Web 会话层（扫码登录，浏览器 cookie）
        - 两者都用
        - 未配置 / 不涉及
  - type: textarea
    id: logs
    attributes:
      label: 错误输出（脱敏后粘贴）
      description: 工具返回的 isError 内容或 stderr 日志；请勿粘贴 AppSecret / access_token / cookie
      render: text
